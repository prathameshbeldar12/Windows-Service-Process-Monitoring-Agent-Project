{% extends "base.html" %}

{% block title %}Reset Password - SENTINEL EDR{% endblock %}

{% block content %}

<div class="min-h-screen flex items-center justify-center px-4 py-8">

    <div
        class="
        page-enter
        glass
        w-full
        max-w-md
        border
        border-cyan-400/20
        rounded-2xl
        shadow-2xl
        "
    >

        <div class="px-6 sm:px-8 pt-8 text-center">

            <div
                class="
                w-16
                h-16
                mx-auto
                rounded-2xl
                bg-cyan-400/5
                border
                border-cyan-400/30
                flex
                items-center
                justify-center
                "
            >
                <span class="material-symbols-outlined text-3xl text-cyan-400">
                    password
                </span>
            </div>

            <h1 class="mt-5 text-2xl font-bold text-cyan-400">
                RESET PASSWORD
            </h1>

            <p class="mt-2 text-[10px] font-mono tracking-widest text-slate-500">
                ESTABLISH NEW SECURITY KEY
            </p>

        </div>

        <form
            method="POST"
            action="{% url 'reset_password' %}"
            class="px-6 sm:px-8 py-8 space-y-5"
        >

            {% csrf_token %}

            <div>

                <label
                    for="username"
                    class="block mb-2 text-[10px] font-mono uppercase text-slate-400"
                >
                    Operator Username
                </label>

                <input
                    type="text"
                    name="username"
                    id="username"
                    value="{{ username|default:'' }}"
                    required
                    placeholder="Confirm username..."
                    class="
                    input-field
                    w-full
                    bg-[#070b14]
                    border
                    border-slate-700
                    rounded-xl
                    px-4
                    py-3
                    text-sm
                    font-mono
                    "
                >

            </div>

            <div>

                <label
                    for="otp"
                    class="block mb-2 text-[10px] font-mono uppercase text-slate-400"
                >
                    6-Digit Reset Code
                </label>

                <input
                    type="text"
                    name="otp"
                    id="otp"
                    required
                    maxlength="6"
                    minlength="6"
                    pattern="[0-9]{6}"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    placeholder="000000"
                    class="
                    input-field
                    w-full
                    bg-[#070b14]
                    border
                    border-slate-700
                    rounded-xl
                    px-4
                    py-4
                    text-center
                    text-xl
                    tracking-[.5em]
                    font-mono
                    "
                >

            </div>

            <div>

                <label
                    for="new_password"
                    class="block mb-2 text-[10px] font-mono uppercase text-slate-400"
                >
                    New Password
                </label>

                <div class="relative">

                    <input
                        type="password"
                        name="new_password"
                        id="new_password"
                        required
                        minlength="8"
                        autocomplete="new-password"
                        placeholder="Enter new password..."
                        class="
                        input-field
                        w-full
                        bg-[#070b14]
                        border
                        border-slate-700
                        rounded-xl
                        px-4
                        pr-12
                        py-3
                        text-sm
                        font-mono
                        "
                    >

                    <button
                        type="button"
                        onclick="togglePassword('new_password', this)"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-cyan-400"
                    >
                        <span class="material-symbols-outlined text-base">
                            visibility
                        </span>
                    </button>

                </div>

            </div>

            <div>

                <label
                    for="confirm_password"
                    class="block mb-2 text-[10px] font-mono uppercase text-slate-400"
                >
                    Confirm New Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    id="confirm_password"
                    required
                    autocomplete="new-password"
                    placeholder="Re-enter new password..."
                    class="
                    input-field
                    w-full
                    bg-[#070b14]
                    border
                    border-slate-700
                    rounded-xl
                    px-4
                    py-3
                    text-sm
                    font-mono
                    "
                >

            </div>

            <button
                type="submit"
                class="
                cyber-button
                w-full
                bg-cyan-400
                hover:bg-cyan-300
                text-[#051424]
                py-3
                rounded-xl
                font-mono
                text-xs
                font-bold
                "
            >
                UPDATE PASSWORD
            </button>

            <div class="text-center">

                <a
                    href="{% url 'login' %}"
                    class="text-[10px] font-mono text-slate-400 hover:text-cyan-400"
                >
                    ← RETURN TO AUTHENTICATE
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
