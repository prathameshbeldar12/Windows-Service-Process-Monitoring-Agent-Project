version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sentinel_edr_db
    environment:
      POSTGRES_DB: sentinel_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword_1337
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: sentinel_edr_web
    command: >
      bash -c "python manage.py makemigrations &&
               python manage.py migrate &&
               python manage.py runserver 0.0.0.0:5000"
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=sentinel_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword_1337
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_DEBUG=True
    depends_on:
      - db

volumes:
  postgres_data:
